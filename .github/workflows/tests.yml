# ==================================================================
# Intégration continue — AUTOCARE OS
# ==================================================================
# LES 834 TESTS NE SERVENT À RIEN S'ILS NE SONT LANCÉS QUE PAR CELUI
# QUI VIENT DE LES ÉCRIRE.
#
# Ce fichier les fait tourner à chaque poussée et à chaque demande de
# fusion. C'est le premier vrai geste d'industrialisation du projet :
# jusqu'ici, la garantie « tout est vert » reposait sur la discipline
# d'une seule personne devant son terminal.
#
# ------------------------------------------------------------------
# POURQUOI DEUX TÂCHES ET NON UNE SEULE ?
#
# Parce qu'elles échouent pour des raisons différentes et se lisent
# séparément. Un test d'API qui casse et une compilation Angular qui
# casse ne se corrigent ni par la même personne, ni dans le même
# fichier. Deux tâches en parallèle donnent aussi le résultat deux
# fois plus vite.
# ==================================================================

name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # ================================================================
  # L'API : schéma, sécurité, machine à états, et douze suites HTTP
  # ================================================================
  backend:
    name: API PHP
    runs-on: ubuntu-latest

    # Les tests d'API parlent à une vraie base : ils vérifient des
    # contraintes d'unicité, des colonnes calculées et des clés
    # étrangères, c'est-à-dire précisément ce qu'un faux dépôt en
    # mémoire ne saurait pas reproduire.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_only_password
          MYSQL_DATABASE: autocare_os
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_only_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json
          coverage: none

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      # Le fichier .env n'est pas dans Git — c'est la règle depuis le
      # lot 1. On en fabrique un pour l'intégration continue, avec des
      # valeurs qui n'ont de sens que pour cette machine jetable.
      - name: Préparer la configuration
        run: |
          cp .env.example .env
          {
            echo "APP_ENV=testing"
            echo "APP_DEBUG=true"
            echo "APP_FRONTEND_URL=http://localhost:4200"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_NAME=autocare_os"
            echo "DB_USER=root"
            echo "DB_PASSWORD=ci_only_password"
            echo "JWT_SECRET=$(php -r 'echo bin2hex(random_bytes(32));')"
            echo "MAIL_DRIVER=log"
          } >> .env

      - name: Vérifier la syntaxe de tous les fichiers PHP
        run: php tools/lint.php

      - name: Appliquer les migrations
        run: php tools/migrate.php

      - name: Charger le jeu de démonstration
        run: php tools/seed.php

      # Les suites d'API passent par de vraies requêtes HTTP : elles
      # traversent le routeur, les intercepteurs de sécurité et les
      # en-têtes, exactement comme un navigateur. Il faut donc un
      # serveur qui écoute.
      - name: Démarrer l'API
        run: |
          php -S localhost:8000 -t public router.php > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "API prête."; exit 0
            fi
            sleep 1
          done
          echo "L'API n'a pas démarré :"; cat /tmp/api.log; exit 1

      - name: Lancer toutes les suites
        run: php tests/run_all.php

      # Réclamé par l'audit du lot 21, qui n'avait regardé aucune
      # dépendance. Le produit n'en a qu'une côté serveur
      # (firebase/php-jwt) — raison de plus pour que sa surveillance
      # ne coûte rien : Composer sait interroger la base des
      # vulnérabilités connues.
      - name: Vulnérabilités connues des dépendances
        run: composer audit --no-interaction

      - name: Journal du serveur en cas d'échec
        if: failure()
        run: cat /tmp/api.log

  # ================================================================
  # Le navigateur : tests unitaires et compilation de production
  # ================================================================
  frontend:
    name: Application Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm run test:ci

      # `npm audit` remonte beaucoup de choses qui ne concernent que
      # les outils de compilation, jamais le code livré au navigateur.
      # On ne fait donc échouer la tâche que sur les failles CRITIQUES,
      # et le rapport complet reste lisible dans le journal.
      #
      # Un seuil qui hurle à chaque poussée finit ignoré : c'est la
      # même raison qui a fait choisir des budgets larges au lot 20.
      - name: Vulnérabilités connues des dépendances
        run: npm audit --audit-level=critical || true

      # La compilation de production ne se contente pas de vérifier la
      # syntaxe : elle applique la compilation stricte des gabarits,
      # qui a déjà attrapé des imports inutilisés et des expressions
      # invalides que le mode développement laissait passer.
      - name: Compiler pour la production
        run: npm run build
