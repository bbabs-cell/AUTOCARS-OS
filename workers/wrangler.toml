name = "autocare-api"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

# ==================================================================
# QUI PEUT ATTEINDRE CE WORKER
# ==================================================================
# Les deux réglages ci-dessous étaient implicites, et Wrangler
# l'a signalé au premier déploiement. Un défaut par défaut reste un
# défaut : on les écrit.

# L'adresse « autocare-api.<compte>.workers.dev ».
#
# Vraie tant que le domaine n'est pas branché : c'est la seule façon
# d'atteindre le produit. À REPASSER À `false` une fois
# autocare.magyapro.com en service — non pas parce que cette adresse
# serait dangereuse, mais parce qu'elle CONTOURNE la zone Cloudflare :
# les règles de pare-feu, la limitation de débit et les journaux
# qu'on posera sur magyapro.com ne s'y appliquent pas. Deux portes,
# une seule surveillée.
workers_dev = true

# Les « Preview URLs » : chaque version déployée reçoit sa propre
# adresse publique, « <version>-autocare-api.<compte>.workers.dev ».
#
# REFUSÉ, et ce n'est pas une précaution de principe. Ces adresses
# partagent les MÊMES LIAISONS que la production — la même base D1,
# le même seau de photos. Une version d'avant un correctif de
# sécurité resterait donc accessible, et utilisable contre les
# données réelles, indéfiniment.
#
# Corriger une faille consisterait à déployer une version qui la
# répare, en laissant en ligne celle qui l'ouvre.
preview_urls = false

# ==================================================================
# LE WORKER SERT AUSSI L'APPLICATION
# ==================================================================
# Un seul déploiement, une seule origine.
#
# C'est ce que `environment.ts` suppose depuis le début : `apiUrl`
# vaut « /api », une adresse relative. Servir l'application depuis un
# autre domaine que l'API la rendrait CROISÉE — pré-vol CORS, cookie
# de rafraîchissement sous d'autres règles, et des en-têtes à porter
# côté serveur qui n'existent que pour cela.
#
# `run_worker_first` décide qui répond : tout ce qui commence par
# « /api/ » va au Worker, le reste aux fichiers. Sans cette ligne, le
# repli page unique renverrait `index.html` sur les appels d'API —
# l'application recevrait du HTML là où elle attend du JSON, et
# n'afficherait aucune erreur utile.
#
# `single-page-application` sert `index.html` sur une adresse qui ne
# correspond à aucun fichier : c'est ce qui permet de rafraîchir
# /operations/42 sans tomber sur un 404.
#
# LE DOSSIER DOIT ÊTRE CONSTRUIT AVANT DE DÉPLOYER :
#     cd ../frontend && npm run build
[assets]
directory = "../frontend/dist/frontend/browser"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "autocare"
database_id = "6f822fa7-9e94-49ad-84e8-f30cf093a4a1"   # région WEUR
migrations_dir = "migrations"

# Les tests ont besoin du secret et du chemin des migrations. En
# production, JWT_SECRET est un secret Wrangler, jamais une variable
# de ce fichier — qui est suivi par Git.
[vars]
JWT_ACCESS_TTL_MINUTES = "30"
# local | production — décide notamment de l'attribut Secure du cookie.
APP_ENV = "production"

# L'adresse d'expédition des courriels (mot de passe oublié).
MAIL_FROM = "no-reply@magyapro.com"

# Le lien envoyé dans le courriel de réinitialisation pointe ici.
#
# SOUS-DOMAINE, ET NON LA RACINE : « magyapro.com » sert déjà un autre
# projet, et redirige vers « www ». Poser cette valeur sur la racine
# enverrait les employés sur ce site-là au moment précis où ils
# essaient de récupérer leur mot de passe — un lien qui n'échoue pas,
# qui mène simplement ailleurs. Le genre de défaut qu'on ne voit pas
# en recette, parce qu'on ne clique jamais vraiment sur le lien.
APP_FRONTEND_URL = "https://autocare.magyapro.com"

# L'envoi de courriel passe par RESEND. Sa clé est un SECRET Wrangler,
# jamais une variable de ce fichier — il est suivi par Git :
#
#     npx wrangler secret put RESEND_TOKEN
#
# Et AVANT cela, chez Resend : ajouter le domaine magyapro.com et poser
# les enregistrements DNS qu'il donne (SPF, DKIM) dans la zone
# Cloudflare. Sans eux, Resend accepte la requête et le courriel
# n'arrive pas — la panne la plus déroutante de ce module, parce
# qu'elle ne ressemble pas à une panne.
#
# Tant que la clé n'est pas posée, les courriels sont écrits dans les
# traces du Worker et le produit continue de fonctionner. Voir
# src/core/courriel.ts.

# Le ré-encodage des photos d'inspection. C'est lui qui remplace `gd`
# du PHP : on ne réutilise jamais les octets reçus, on en fabrique de
# nouveaux à partir des pixels.
[images]
binding = "IMAGES"

# Les photos elles-mêmes. R2 et non D1 : une base de données n'est pas
# un disque, et quelques milliers de photos y coûteraient cher pour un
# usage qu'un stockage d'objets fait mieux.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "autocare-photos"
