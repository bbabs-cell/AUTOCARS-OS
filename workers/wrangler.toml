name = "autocare-api"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "autocare"
database_id = "a-remplacer-au-premier-deploiement"
migrations_dir = "migrations"

# Les tests ont besoin du secret et du chemin des migrations. En
# production, JWT_SECRET est un secret Wrangler, jamais une variable
# de ce fichier — qui est suivi par Git.
[vars]
JWT_ACCESS_TTL_MINUTES = "30"
# local | production — décide notamment de l'attribut Secure du cookie.
APP_ENV = "production"

# L'adresse d'expédition des courriels (mot de passe oublié).
MAIL_FROM = "no-reply@magyapro.com"

# Le lien envoyé dans le courriel de réinitialisation pointe ici.
APP_FRONTEND_URL = "https://magyapro.com"

# L'envoi de courriel passe par RESEND. Sa clé est un SECRET Wrangler,
# jamais une variable de ce fichier — il est suivi par Git :
#
#     npx wrangler secret put RESEND_TOKEN
#
# Et AVANT cela, chez Resend : ajouter le domaine magyapro.com et poser
# les enregistrements DNS qu'il donne (SPF, DKIM) dans la zone
# Cloudflare. Sans eux, Resend accepte la requête et le courriel
# n'arrive pas — la panne la plus déroutante de ce module, parce
# qu'elle ne ressemble pas à une panne.
#
# Tant que la clé n'est pas posée, les courriels sont écrits dans les
# traces du Worker et le produit continue de fonctionner. Voir
# src/core/courriel.ts.

# Le ré-encodage des photos d'inspection. C'est lui qui remplace `gd`
# du PHP : on ne réutilise jamais les octets reçus, on en fabrique de
# nouveaux à partir des pixels.
[images]
binding = "IMAGES"

# Les photos elles-mêmes. R2 et non D1 : une base de données n'est pas
# un disque, et quelques milliers de photos y coûteraient cher pour un
# usage qu'un stockage d'objets fait mieux.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "autocare-photos"
