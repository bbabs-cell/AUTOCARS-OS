# ==================================================================
# AUTOCARE OS — en-têtes de sécurité
# ==================================================================
# Ce fichier est INCLUS dans le bloc `server` ET dans chaque
# `location` qui définit un `add_header` à lui.
#
# POURQUOI CETTE RÉPÉTITION APPAREMMENT INUTILE
#
# C'est la règle d'héritage la plus piégeuse de nginx : les directives
# `add_header` d'un bloc ne s'ajoutent PAS à celles du bloc parent —
# elles les REMPLACENT toutes. Une seule ligne
#
#     add_header Cache-Control "no-store" always;
#
# dans `location = /index.html` suffisait à supprimer HSTS, CSP,
# X-Frame-Options, nosniff, Referrer-Policy et Permissions-Policy sur
# la page principale du site. Le mot-clé `always` n'y change rien :
# il porte sur les codes d'erreur, pas sur l'héritage.
#
# Les en-têtes étaient donc écrits dans la configuration et servis à
# PERSONNE. Un `curl -I` sur le site le montre en une seconde ; la
# relecture du fichier, jamais. C'est la raison d'être du §6 de
# docs/deploiement.md : on vérifie ce qui sort, pas ce qu'on a écrit.
#
# LA RÈGLE À RETENIR : dès qu'un `location` contient un `add_header`,
# il doit inclure ce fichier.
# ==================================================================

# HSTS : le navigateur refusera de revenir en HTTP pendant un an.
#
# À N'ACTIVER QU'UNE FOIS LE CERTIFICAT EN PLACE ET VÉRIFIÉ. Un HSTS
# posé sur un site dont le HTTPS casse rend le site inaccessible pour
# tous ceux qui l'ont déjà visité — et on ne peut pas le retirer de
# leur navigateur.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# La politique de contenu. Elle se pose ICI et pas dans l'API : c'est
# ce serveur qui envoie la page, et une CSP ne protège que le document
# qui la porte.
#
# 'self' partout, aucun 'unsafe-inline' sur les scripts : Angular n'en
# a pas besoin en production. `style-src` tolère l'inline parce que le
# framework pose des styles calculés.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;

# Le navigateur n'a besoin d'aucune de ces permissions.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
